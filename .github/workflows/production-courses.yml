# Triggered on pushes to the production branch that touch the courses pillar.
# Deploys to the production environment at learn.arm.com/courses/.
name: Build and Deploy Production — Courses

on:
  push:
    branches: [production]
    paths:
      - 'content/courses/**'
      - 'config-courses.toml'
      - 'archetypes/course/**'
      - 'themes/**'
  workflow_dispatch:

jobs:
  build_and_deploy_prod:
    name: Build and Deploy Courses Prod
    uses: ./.github/workflows/deploy-pillar.yml
    permissions:
      id-token: write
      contents: read
    with:
      target: prod
      aws-region: us-east-1
      deploy-role-arn: arn:aws:iam::084149021538:role/Proj-GHA-arm-courses-prod
      hugo-config: config-courses.toml
      pillar-path: courses
    secrets:
      HUGO_LLM_API: ${{ secrets.HUGO_LLM_API }}
      HUGO_RAG_API: ${{ secrets.HUGO_RAG_API }}
      HUGO_AUDIO_API: ${{ secrets.HUGO_AUDIO_API }}
      HUGO_PHI_ONNX_LLM_API: ${{ secrets.HUGO_PHI_ONNX_LLM_API }}
      HUGO_DEV_PROG_SIGNIUP_FORM_MUNCHKIN_ID: ${{ secrets.HUGO_DEV_PROG_SIGNIUP_FORM_MUNCHKIN_ID }}
      HUGO_FORM_ID_FOR_PROGRAM_SIGNUP: ${{ secrets.HUGO_FORM_ID_FOR_PROGRAM_SIGNUP }}
